<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f2a1e"/>
  <!-- route line with two stops and a travelling bead: the same motif the site uses -->
  <line x1="14" y1="32" x2="50" y2="32" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
  <circle cx="14" cy="32" r="6" fill="#ee4b1e"/>
  <circle cx="50" cy="32" r="6" fill="#ee4b1e"/>
  <circle cx="32" cy="32" r="7" fill="#fbbf24"/>
</svg>
