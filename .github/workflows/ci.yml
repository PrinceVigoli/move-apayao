name: System checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: move_apayao_validation_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check patched dependency regressions
        run: pnpm run security:test
      - name: Audit critical production dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Typecheck, test, and build workspace
        run: pnpm run test && pnpm run build
      - name: Test fixed-loop inventory and driver lifecycle
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/move_apayao_validation_ci
          REDIS_URL: redis://127.0.0.1:6379/14
          PORT: '5501'
          NODE_ENV: development
          JWT_SECRET: ci-only-disposable-local-test-secret-not-for-deployment
          LOCAL_FIXED_LOOP_TEST: '1'
          LOCAL_SMOKE_API_URL: http://127.0.0.1:5501
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d move_apayao_validation_ci -c 'CREATE EXTENSION IF NOT EXISTS postgis'
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/scripts exec tsx src/seed-local-fixed-loop.ts
          node artifacts/api-server/dist/index.mjs > /tmp/fixed-loop-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5501/api/livez > /dev/null; then break; fi
            sleep 1
          done
          node scripts/fixed-loop-integration.mjs
          node scripts/account-deletion-integration.mjs
      - name: Check Expo SDK compatibility
        run: |
          pnpm --filter @workspace/mobile exec expo install --check
          pnpm --filter @workspace/driver exec expo install --check
      - name: Export passenger Android bundle
        run: pnpm --filter @workspace/mobile exec expo export --platform android --output-dir ../../.ci-output/mobile
      - name: Export driver Android bundle
        run: pnpm --filter @workspace/driver exec expo export --platform android --output-dir ../../.ci-output/driver
