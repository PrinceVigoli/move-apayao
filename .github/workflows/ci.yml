name: System checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check patched dependency regressions
        run: pnpm run security:test
      - name: Audit critical production dependencies
        run: pnpm audit --prod --audit-level critical
      - name: Typecheck, test, and build workspace
        run: pnpm run test && pnpm run build
      - name: Check Expo SDK compatibility
        run: |
          pnpm --filter @workspace/mobile exec expo install --check
          pnpm --filter @workspace/driver exec expo install --check
      - name: Export passenger Android bundle
        run: pnpm --filter @workspace/mobile exec expo export --platform android --output-dir ../../.ci-output/mobile
      - name: Export driver Android bundle
        run: pnpm --filter @workspace/driver exec expo export --platform android --output-dir ../../.ci-output/driver
