networks:
  move-apayao:
    driver: bridge

volumes:
  move-apayao-db-data:

services:
  db:
    # PostGIS keeps the existing PostgreSQL data volume compatible while
    # enabling spatial points, indexes, route lines, buffers, and GeoJSON.
    image: postgis/postgis:16-3.5
    container_name: move-apayao-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: move_apayao
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - move-apayao-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - move-apayao

  redis:
    image: redis:7
    container_name: move-apayao-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - move-apayao

  # Optional: a web UI for browsing the Postgres database.
  # Open http://localhost:8080 (System: PostgreSQL, Server: db, User: postgres, Password: postgres, DB: move_apayao)
  adminer:
    image: adminer
    container_name: move-apayao-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - move-apayao
